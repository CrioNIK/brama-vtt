name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
      - run: npm run wasm:check
      - run: npm run wasm:test
      - run: npm test
      - run: npm run build
